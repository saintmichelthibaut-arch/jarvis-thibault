# ═══════════════════════════════════════════════════════════════════
#  Configuration de Jarvis — ~/.jarvis/config.toml
#  Après une modification : quittez Jarvis puis relancez l'app Jarvis.
# ═══════════════════════════════════════════════════════════════════

[moi]
prenom = "Thibault"
appellations = ["Monsieur", "Thibault"]   # la 1re est utilisée le plus souvent
ville = "Paris"                            # pour la météo
fuseau = "Europe/Paris"

[briefing]
heure = "07:00"                            # heure du récap du matin
jours = ["lun", "mar", "mer", "jeu", "ven", "sam", "dim"]
lecture_auto = true                        # le lit à voix haute sur le Mac
notification = true                        # notification macOS
ouvrir_tableau = true                      # ouvre le tableau de bord

[cerveau]
# "ollama" = sur votre Mac, gratuit et privé (les données ne sortent pas)
# "openai" = plus intelligent et plus drôle, quelques centimes par jour
fournisseur = "ollama"
modele = "qwen3.5:9b"                      # Mac 8 Go : "qwen3.5:4b" · OpenAI : "gpt-4.1-mini"
temperature = 0.7

[voix]
fournisseur = "openai"                     # "openai" (réaliste) · "mac" (gratuit) · "aucune"
modele = "gpt-4o-mini-tts"
voix = "onyx"                              # essayez aussi "ash", "echo", "sage", "fable"
style = "jarvis"                           # "jarvis" : majordome IA grave et posé · "perso" : utilise « consignes »
effet = "jarvis"                           # "jarvis" : léger effet d'IA dans la pièce · "aucun"
consignes = "Parle en français de France, voix grave et posée de majordome élégant, légèrement amusé, débit naturel."
voix_mac = "Thomas"                        # voix utilisée si fournisseur = "mac"

[agenda]
# Jarvis lit l'app Calendrier du Mac : iCloud ET Outlook (ajoutez votre compte
# Outlook dans Réglages Système → Comptes Internet, cochez « Calendriers »).
source = "mac"
calendriers_ignores = []                   # ex. ["Anniversaires", "Jours fériés en France"]

[moodle]
# Connectez-vous avec : bash ~/jarvis-thibault-main/connecter-moodle.sh
actif = false
url = ""

[fyxigo]
# Fyxigo est une place de marché : le client paie l'intervention, Fyxigo garde
# une commission et reverse le reste à l'artisan. Pas d'abonnement, donc pas de MRR.
stripe = true
devise = "EUR"
taux_commission = 0.30                     # part gardée par Fyxigo (30 %)
objectif_commission_mois = 3000            # commission Fyxigo visée par mois (€)
objectif_paiements_mois = 0                # interventions payées visées par mois (0 = pas d'objectif)
objectif_clients_mois = 0                  # nouveaux clients visés par mois (0 = pas d'objectif)
fichier_taches = "fyxigo.md"               # vos objectifs et tâches (~/.jarvis/fyxigo.md)

[fyxigo.base]
# Chiffres tirés de la base Supabase de l'appli Fyxigo (projet « illico »).
# L'adresse de connexion se met dans secrets.toml (base_url), idéalement avec
# un utilisateur en lecture seule.
# Chaque indicateur = une requête SQL qui renvoie UN nombre.
# panneau = "hier" (panneau de droite) ou "semaine" (panneau de gauche)
# format  = "nombre", "euros", "pourcent" ou "note"
# Ces requêtes correspondent au vrai schéma de Fyxigo (tables
# intervention_requests, prestataires, avis) et ont été testées.
active = false

[[fyxigo.base.indicateurs]]
nom = "Demandes d'intervention hier"
sql = "SELECT count(*) FROM intervention_requests WHERE created_at >= (date_trunc('day', now() AT TIME ZONE 'Europe/Paris') - interval '1 day') AT TIME ZONE 'Europe/Paris' AND created_at < date_trunc('day', now() AT TIME ZONE 'Europe/Paris') AT TIME ZONE 'Europe/Paris'"
panneau = "hier"

[[fyxigo.base.indicateurs]]
nom = "Interventions terminées hier"
sql = "SELECT count(*) FROM intervention_requests WHERE terminee_le >= (date_trunc('day', now() AT TIME ZONE 'Europe/Paris') - interval '1 day') AT TIME ZONE 'Europe/Paris' AND terminee_le < date_trunc('day', now() AT TIME ZONE 'Europe/Paris') AT TIME ZONE 'Europe/Paris'"
panneau = "hier"

[[fyxigo.base.indicateurs]]
nom = "Demandes sans artisan (7 j)"
sql = "SELECT count(*) FROM intervention_requests WHERE status = 'annulee' AND prestataire_id IS NULL AND created_at >= now() - interval '7 days'"
panneau = "hier"

[[fyxigo.base.indicateurs]]
nom = "Signalements clients en attente"
sql = "SELECT count(*) FROM intervention_requests WHERE signale_le IS NOT NULL AND payment_status NOT IN ('redistribue', 'rembourse')"
panneau = "hier"

[[fyxigo.base.indicateurs]]
nom = "Taux d'acceptation (7 j)"
sql = "SELECT round(100.0 * count(acceptee_le) / nullif(count(*), 0)) FROM intervention_requests WHERE created_at >= now() - interval '7 days'"
panneau = "semaine"
format = "pourcent"

[[fyxigo.base.indicateurs]]
nom = "Délai médian d'acceptation, min (7 j)"
sql = "SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM acceptee_le - created_at) / 60) FROM intervention_requests WHERE acceptee_le IS NOT NULL AND created_at >= now() - interval '7 days'"
panneau = "semaine"

[[fyxigo.base.indicateurs]]
nom = "Artisans vérifiés"
sql = "SELECT count(*) FROM prestataires WHERE statut_verification = 'verifie'"
panneau = "semaine"

[[fyxigo.base.indicateurs]]
nom = "Dossiers d'artisans à vérifier"
sql = "SELECT count(*) FROM prestataires WHERE statut_verification = 'en_attente'"
panneau = "semaine"

[[fyxigo.base.indicateurs]]
nom = "Note moyenne clients"
sql = "SELECT avg(note) FROM avis"
panneau = "semaine"
format = "note"

[ecran]
forme = "cerveau"        # "cerveau" (comme la vidéo) ou "sphere" (sphère de particules)
couleurs = "video"       # "video" (multicolore) ou "bleu" (tout en bleu)
plein_ecran = false      # true : l'app Jarvis s'ouvre en plein écran

[rappels]
avant_rdv = 10           # Jarvis annonce chaque rendez-vous X minutes avant (0 = jamais)

[bilan]
actif = true             # bilan de la journée chaque soir
heure = "19:30"
lecture_auto = false     # true : il le lit à voix haute tout seul

[serveur]
port = 8765
