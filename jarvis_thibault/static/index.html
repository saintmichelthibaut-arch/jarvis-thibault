<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#000; --verre:rgba(255,255,255,.035); --trait:rgba(255,255,255,.09); --trait-fort:rgba(255,255,255,.28);
  --blanc:#f2f7ff; --label:#c6cfdf; --doux:#7b8499; --tres-doux:#454c5c; --cyan:#6fd8ff; --vert:#5cffd0; --rose:#ff5470; --ambre:#ffc069;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace; --sans:"Inter","SF Pro Display","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--blanc);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;cursor:default}
#scene{position:fixed;left:0;top:0;z-index:0;display:block}
.voile{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 50%,transparent 60%,rgba(0,0,0,.85) 100%)}
.cadre{position:fixed;inset:22px;z-index:2;pointer-events:none}
.cadre i{position:absolute;width:12px;height:12px;border-color:var(--trait-fort);border-style:solid}
.cadre i:nth-child(1){top:0;left:0;border-width:1px 0 0 1px}.cadre i:nth-child(2){top:0;right:0;border-width:1px 1px 0 0}
.cadre i:nth-child(3){bottom:0;left:0;border-width:0 0 1px 1px}.cadre i:nth-child(4){bottom:0;right:0;border-width:0 1px 1px 0}
.cadre b{display:none}
@keyframes clig{50%{opacity:.25}}

/* en-tête */
.marque{position:fixed;z-index:5;top:40px;left:52px}
.marque .nom{font-family:var(--sans);font-weight:200;font-size:15px;letter-spacing:.85em;color:#fff}
.marque .ss{display:flex;align-items:center;gap:8px;font:400 8px var(--mono);letter-spacing:.32em;color:var(--doux);margin-top:10px;text-transform:uppercase}
.marque .ss i{width:4px;height:4px;border-radius:50%;background:var(--vert);box-shadow:0 0 6px var(--vert)}
#onde{display:block;width:120px;height:16px;margin-top:14px;opacity:.7}
.bandeau{position:fixed;z-index:5;top:38px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;font:400 8.5px var(--mono);letter-spacing:.3em;
  color:var(--doux);text-transform:uppercase;white-space:nowrap;transition:.5s}
.puce{display:flex;align-items:center;gap:9px;color:var(--label)}
.puce i{width:5px;height:5px;border-radius:50%;background:var(--vert);box-shadow:0 0 8px var(--vert);transition:.4s}
.bandeau.visible .puce{color:#fff}.bandeau.visible .puce i{background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:clig 1s infinite}
#bandeauDate{padding-left:14px;border-left:1px solid var(--trait)}
.droite-tete{position:fixed;z-index:5;top:34px;right:52px;text-align:right}
.heure{font-family:var(--sans);font-weight:200;font-size:44px;letter-spacing:.02em;color:#fff;line-height:1}
.etat{display:flex;align-items:center;justify-content:flex-end;gap:8px;font:400 8px var(--mono);letter-spacing:.34em;color:var(--doux);text-transform:uppercase;margin-top:10px;order:2}
.etat .rond{width:5px;height:5px;border-radius:50%;background:var(--doux)}.etat .rond::after{display:none}
.etat.actif{color:#fff}.etat.actif .rond{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:clig .9s infinite}
.droite-tete{display:flex;flex-direction:column;align-items:flex-end}.heure{order:1}.meteo{order:3}
.meteo{display:flex;align-items:center;justify-content:flex-end;gap:9px;margin-top:8px;font:400 8px var(--mono);letter-spacing:.2em;color:var(--doux);text-transform:uppercase;line-height:1.7}
.meteo .boule{display:none}.meteo b{color:#fff;font:300 12px var(--sans);letter-spacing:0}

/* état des systèmes */
.modules{position:fixed;z-index:5;right:52px;top:50%;transform:translateY(-35%);width:150px;display:flex;flex-direction:column;gap:0}
.modules .titre{display:flex;justify-content:space-between;font:400 7.5px var(--mono);letter-spacing:.3em;color:var(--doux);text-transform:uppercase;margin-bottom:10px}
.mod{display:grid;grid-template-columns:1fr auto 5px;gap:10px;align-items:center;padding:5px 0;font:400 8px var(--mono);letter-spacing:.16em;text-transform:uppercase;border-top:1px solid var(--trait)}
.mod b{font-weight:400;color:var(--label)}.mod span{color:var(--doux);font-size:7.5px}
.mod i{width:4px;height:4px;border-radius:50%;background:var(--vert);box-shadow:0 0 6px var(--vert)}
.mod.ko i{background:transparent;border:1px solid var(--tres-doux);box-shadow:none}.mod.ko b,.mod.ko span{color:var(--tres-doux)}
.mod.prevu i{background:var(--ambre);box-shadow:0 0 6px var(--ambre)}

/* fenêtres de verre */
.colonne{position:fixed;z-index:5;top:140px;display:flex;flex-direction:column;gap:12px;width:min(290px,20vw);max-height:calc(100vh - 230px);overflow-y:auto;scrollbar-width:none}.colonne::-webkit-scrollbar{display:none}
.colonne.g{left:52px}.colonne.d{right:232px}
.pan{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--trait);border-radius:2px;padding:14px 16px 12px;
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:0 30px 60px rgba(0,0,0,.5);
  display:none;opacity:0;transform:translateY(12px);filter:blur(6px);transition:opacity .5s,transform .7s cubic-bezier(.16,1,.3,1),filter .6s}
.pan::before{content:"";position:absolute;left:16px;top:-1px;width:28px;height:1px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.pan.ouvert{display:block}.pan.visible{opacity:1;transform:none;filter:none}
.pan h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:400 7.5px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--doux);
  padding-bottom:10px;margin-bottom:4px}
.pan h2 span:last-child{color:var(--tres-doux);letter-spacing:.12em}
.kpi{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0;border-top:1px solid var(--trait)}
.kpi .n{font:400 8px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--label);line-height:1.6}
.kpi .n small{display:block;font:400 9.5px var(--sans);letter-spacing:0;color:var(--doux);text-transform:none}
.kpi .v{font:200 19px var(--sans);color:#fff;white-space:nowrap}
.kpi .v.fort{font-size:24px}
.kpi .v small{font:400 8.5px var(--mono);color:var(--vert);margin-left:6px}
.barre{height:1px;background:var(--trait);margin:4px 0 4px;position:relative}
.barre i{position:absolute;inset:-.5px auto -.5px 0;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.leg{display:flex;justify-content:space-between;font:400 7.5px var(--mono);color:var(--doux);letter-spacing:.12em;padding-bottom:3px;text-transform:uppercase}
.spark svg{width:100%;height:30px;display:block;margin-top:8px}.spark rect{fill:rgba(255,255,255,.22)}.spark rect.auj{fill:var(--cyan)}
.evt{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:6px 0;align-items:baseline;border-top:1px solid var(--trait)}
.evt .t{font:400 10px var(--mono);color:var(--cyan)}
.evt .x{font:300 12.5px var(--sans);color:#fff;line-height:1.4}.evt .x small{display:block;font:400 8.5px var(--mono);color:var(--doux);letter-spacing:.06em}
.evt.passe{opacity:.32}.evt.maintenant .t{color:#fff;text-shadow:0 0 8px var(--cyan)}
.citation{display:block;padding:8px 0 10px}
.citation .n{display:block;font:400 7.5px var(--mono);letter-spacing:.3em;color:var(--cyan);text-transform:uppercase;margin-bottom:6px}
.citation .n br{display:none}
.citation q{display:block;font:300 15px/1.4 var(--sans);color:#fff;quotes:none}
.tache{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font:300 12px/1.45 var(--sans);color:var(--label);cursor:pointer;background:none;border:0;border-top:1px solid var(--trait);text-align:left;width:100%}
.tache:hover{color:#fff}.tache .cb{flex:0 0 8px;height:8px;margin-top:5px;border:1px solid var(--doux);border-radius:50%}
.tache.fait{opacity:.32;text-decoration:line-through}.tache.fait .cb{background:var(--cyan);border-color:var(--cyan)}
.tag{font:400 7px var(--mono);letter-spacing:.14em;padding:1px 5px;margin-left:7px;border:1px solid var(--trait-fort);color:var(--label);white-space:nowrap;vertical-align:middle;text-transform:uppercase}
.tag.retard{border-color:var(--rose);color:var(--rose)}
.devoir{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:6px 0;align-items:baseline;border-top:1px solid var(--trait)}
.devoir .t{font:400 8.5px var(--mono);color:var(--ambre);line-height:1.4}.devoir.urgent .t{color:var(--rose)}
.devoir .x{font:300 12px var(--sans);color:#fff;line-height:1.4}.devoir .x small{display:block;font:400 8px var(--mono);color:var(--doux)}
.rappel{font:400 8px var(--mono);color:var(--cyan);letter-spacing:.08em;padding-top:7px;border-top:1px solid var(--trait);margin-top:3px}
.vide{font:300 11.5px/1.5 var(--sans);color:var(--doux);padding:6px 0;border-top:1px solid var(--trait)}
.err{font:400 7.5px var(--mono);color:var(--doux);line-height:1.5;padding-top:5px}

/* étiquettes des nœuds */
.noeuds{position:fixed;inset:0;z-index:3;pointer-events:none}
.noeud{position:absolute;transform:translate(12px,-50%);padding:0 0 0 0;font:400 7.5px/1.5 var(--mono);letter-spacing:.28em;text-transform:uppercase;white-space:nowrap;color:#fff!important;transition:opacity .5s}
.noeud small{display:block;font:300 10px var(--sans);letter-spacing:.02em;color:var(--doux);text-transform:none}

/* bas */
.reponse{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:128px;width:min(820px,62vw);text-align:center;font:200 24px/1.4 var(--sans);color:#fff;letter-spacing:.005em;
  text-shadow:0 2px 20px #000;min-height:1.4em;transition:opacity .3s}
.reponse.vide{opacity:0}.reponse span.ph{display:block;animation:ph .5s cubic-bezier(.16,1,.3,1)}
@keyframes ph{from{opacity:0;filter:blur(8px);transform:translateY(6px)}to{opacity:1;filter:none;transform:none}}
.aide{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:104px;width:min(700px,60vw);text-align:center;font:400 8px var(--mono);color:var(--cyan);letter-spacing:.1em}
form.transcript{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:58px;width:min(520px,46vw);display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--trait)}
form.transcript .chev{color:var(--cyan);font:400 10px var(--mono)}
form.transcript input{flex:1;background:transparent;border:0;outline:0;color:#e8eefc;font:300 13px var(--sans);letter-spacing:.01em}
form.transcript input::placeholder{color:#555d70}
.pied{position:fixed;z-index:5;bottom:40px;font:400 7.5px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--tres-doux);line-height:2}
.pied.g{left:52px}.pied.d{right:52px;text-align:right}.pied b{color:var(--doux);font-weight:400}
.boutons{display:flex;gap:18px;justify-content:flex-end;margin-bottom:6px}
button.b{font:400 7.5px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--doux);background:none;border:0;border-bottom:1px solid transparent;padding:4px 0;cursor:pointer;transition:.25s}
button.b:hover,button.b.on{color:#fff;border-bottom-color:var(--cyan)}

/* notifications */
.toasts{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:7;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;min-width:240px;max-width:520px;padding:9px 16px;background:rgba(255,255,255,.05);border:1px solid var(--trait);border-radius:2px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 20px 40px rgba(0,0,0,.5);animation:toastIn .6s cubic-bezier(.16,1,.3,1)}
.toast.sort{animation:toastOut .5s forwards}
.toast i{width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);flex:0 0 5px}
.toast b{font:400 7.5px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--doux);white-space:nowrap}
.toast span{font:300 13px var(--sans);color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-6px);filter:blur(6px)}}
.demo{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:7;font:400 7px var(--mono);letter-spacing:.3em;color:var(--tres-doux)}
#boot{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .8s}
#boot.fin{opacity:0;pointer-events:none}
#boot pre{font:400 10px/2.1 var(--mono);color:var(--doux);letter-spacing:.2em;min-width:min(440px,90vw)}#boot pre b{color:var(--vert)}

@media (max-width:1100px){.colonne{width:min(270px,26vw)}.colonne.d{right:52px}.modules{display:none}}
@media (max-width:760px){
  html,body{overflow:auto;height:auto}#scene{position:relative}.voile,.cadre,.noeuds,.modules,.pied{display:none}
  .marque{top:22px;left:20px}.droite-tete{top:18px;right:20px}.heure{font-size:28px}.meteo,#onde{display:none}.bandeau{position:absolute;top:84px}
  .colonne{position:static;width:auto;max-height:none;margin:0 16px 14px}.pan{display:block;opacity:1;transform:none;filter:none}
  .reponse,.aide,form.transcript{position:static;transform:none;width:auto;margin:0 16px 10px}
}
</style>
</head>
<body>
<canvas id="scene"></canvas><div class="voile"></div><div class="cadre"><i></i><i></i><i></i><i></i><b></b><b></b></div>
<div class="noeuds" id="noeuds"></div>
<div id="boot"><pre id="bootTxt"></pre></div>

<div class="marque"><div class="nom">JARVIS</div><div class="ss"><i></i>Système · en ligne</div><canvas id="onde" aria-hidden="true"></canvas></div>
<div class="bandeau" id="bandeau"><span class="puce"><i></i><span id="puceTxt">Système · en ligne</span></span><span id="bandeauDate"></span></div>
<div class="droite-tete">
  <div class="etat" id="etat"><span id="etatTxt">En veille</span><span class="rond"></span></div>
  <div class="heure" id="heure">--:--</div>
  <div class="meteo"><span id="meteoTx">—</span><span class="boule" aria-hidden="true"></span></div>
</div>
<aside class="modules" id="modules"></aside>

<section class="colonne g">
  <div class="pan" id="p-semaine"><h2><span>Fyxigo · 7 jours</span><span>01</span></h2><div id="semaine"></div></div>
  <div class="pan" id="p-hier"><h2><span>Hier</span><span id="hierDate"></span></h2><div id="hier"></div></div>
  <div class="pan" id="p-moodle"><h2><span>Moodle · à rendre</span><span id="nbDevoirs"></span></h2><div id="moodle"></div></div>
</section>
<section class="colonne d">
  <div class="pan" id="p-agenda"><h2><span>Agenda</span><span id="nbEvt"></span></h2><div id="agenda"></div></div>
  <div class="pan" id="p-priorites"><h2><span>Priorités Fyxigo</span><span id="nbTaches"></span></h2><div id="taches"></div></div>
</section>

<div class="reponse vide" id="reponse"></div><div class="aide" id="aide"></div>
<form class="transcript" id="form"><span class="chev">›</span><input id="q" autocomplete="off" placeholder="bonjour jarvis, tu peux me faire le récap de la journée ?" aria-label="Question pour Jarvis"></form>
<div class="pied g"><div><b>Micro</b> · <span id="ecouteTxt">espace pour parler</span></div><div>clap-clap · réveil</div></div>
<div class="pied d">
  <div class="boutons"><button class="b" id="btnEcoute">Parler</button><button class="b" id="btnTableau" title="Afficher / masquer toutes les fenêtres (touche D)">Tableau</button><button class="b" id="btnBriefing">Briefing</button><button class="b" id="btnEcouter">Réécouter</button></div>
  <div><span id="piedEtat">en attente</span></div>
</div>
<div class="toasts" id="toasts"></div>
<div class="demo" id="demo" hidden>MODE DÉMO · DONNÉES FICTIVES</div>
<script>
const $=s=>document.querySelector(s);
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"],JC=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const eur=(x,d="EUR")=>x==null?"—":new Intl.NumberFormat("fr-FR",{style:"currency",currency:d,minimumFractionDigits:0,maximumFractionDigits:x>=1000||Number.isInteger(x)?0:2}).format(x);
const nb=x=>x==null?"—":new Intl.NumberFormat("fr-FR").format(x);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const deux=n=>String(n).padStart(2,"0");
let ETAT=null,historique=[],appellation="Monsieur",COULEURS="video";
const CERVEAU={eclat(){},couleur(){return"#7fd8ff"},ancre(){return null},dessiner(){}};
const ORBE={mode:"veille",niveau:0,forcer:0,analyseur:null};
const INVITE="bonjour jarvis, tu peux me faire le récap de la journée ?";

/* ── Démarrage ── */
(function(){let vu=false;try{vu=sessionStorage.getItem("jarvis-boot")==="1";sessionStorage.setItem("jarvis-boot","1")}catch(e){}
  const boot=$("#boot");if(vu||new URLSearchParams(location.search).has("app")){boot.remove();return}
  const L=["noyau neuronal","cortex agenda","liaison stripe · fixigo","liaison moodle","capteurs atmosphériques","synthèse vocale","personnalité · majordome"];let i=0;const pre=$("#bootTxt");
  const t=setInterval(()=>{if(i<L.length){pre.innerHTML+=`› ${L[i].toUpperCase().padEnd(30,".")} <b>OK</b>\n`;i++}else{clearInterval(t);pre.innerHTML+=`\n  Bonjour, Monsieur.`;
    setTimeout(()=>{boot.classList.add("fin");setTimeout(()=>boot.remove(),800)},600)}},170)})();

/* ── Horloge ── */
function tic(){const n=new Date();$("#heure").textContent=`${deux(n.getHours())}:${deux(n.getMinutes())}`;
  $("#bandeauDate").textContent=`${deux(n.getDate())} / ${deux(n.getMonth()+1)} · ${deux(n.getHours())}:${deux(n.getMinutes())}`}
setInterval(tic,1000);tic();

/* ── Statut ── */
let statutLocal=null;
const TXT={veille:["En veille","Système · en ligne","en attente"],briefing:["Briefing","Briefing · en direct","transmission"],parole:["Parle","Jarvis · en direct","transmission"],
  reflexion:["Réflexion","Analyse · en cours","traitement…"],ecoute:["Écoute","Micro · ouvert","écoute…"]};
function statut(s){statutLocal=s;ORBE.mode=s;const [a,b,c]=TXT[s]||TXT.veille,actif=s!=="veille";
  $("#etatTxt").textContent=a;$("#etat").classList.toggle("actif",actif);$("#puceTxt").textContent=b;$("#piedEtat").textContent=c;$("#bandeau").classList.toggle("visible",actif)}

/* ── Compteurs ── */
const anciens={};let cpt=0,panneau="";
function compter(id,val,fmt){const el=document.getElementById(id);if(!el)return;if(val==null){el.innerHTML=fmt(val);return}
  const de=anciens["_"+id]??0;const t0=performance.now();
  (function pas(t){const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3),v=de+(val-de)*e;el.innerHTML=fmt(k<1?(Number.isInteger(val)?Math.round(v):v):val);if(k<1)requestAnimationFrame(pas)})(t0)}
function kpi(n,val,fmt,cls="",extra="",sous=""){const cle=panneau+n,id="k"+(cpt++);anciens["_"+id]=anciens[cle];anciens[cle]=val;setTimeout(()=>compter(id,val,fmt));
  return `<div class="kpi"><span class="n">${esc(n)}${sous?`<small>${esc(sous)}</small>`:""}</span><span class="v ${cls}"><span id="${id}"></span>${extra}</span></div>`}
function erreur(nom){const e=ETAT?.donnees?.erreurs?.[nom];return e?`<div class="err">${esc(e)}</div>`:""}
function fmtInd(i){return v=>v==null?"—":i.format==="euros"?eur(v):i.format==="note"?`${(Math.round(v*10)/10).toString().replace(".",",")}<small>/5</small>`:i.format==="pourcent"?`${nb(Math.round(v))} %`:nb(Math.round(v*10)/10)}

/* ── Rendu des fenêtres et de la colonne d'état ── */
function rendre(){
  const d=ETAT.donnees,s=d.stripe,o=ETAT.objectifs||{},base=d.base||[],err=d.erreurs||{};
  appellation=ETAT.moi.appellation;$("#demo").hidden=!ETAT.demo;if(ETAT.ecran)COULEURS=ETAT.ecran.couleurs||"video";
  // 7 derniers jours
  let h="";panneau="sem";

      camera.getWorldDirection(tmp);droite.crossVectors(tmp,camera.up).normalize();haut.crossVectors(droite,tmp).normalize();

        lisse[i]+=(v-lisse[i])*.35}
      const rb=R*1.22;let o=0;for(let i=0;i<NW;i++){const j=(i+1)%NW,a=i/NW*6.2832,b=j/NW*6.2832,ra=rb*(1+lisse[i]*.28),rb2=rb*(1+lisse[j]*.28);
        ondePos.set([(Math.cos(a)*droite.x+Math.sin(a)*haut.x)*ra,(Math.cos(a)*droite.y+Math.sin(a)*haut.y)*ra,(Math.cos(a)*droite.z+Math.sin(a)*haut.z)*ra],o);
        ondePos.set([(Math.cos(b)*droite.x+Math.sin(b)*haut.x)*rb2,(Math.cos(b)*droite.y+Math.sin(b)*haut.y)*rb2,(Math.cos(b)*droite.z+Math.sin(b)*haut.z)*rb2],o+3);o+=6}
      ondeGeo.attributes.position.needsUpdate=true;ondeMat.opacity=.25+L*.9;
      for(let k=ondes.length-1;k>=0;k--){const w=ondes[k],age=(t-w.t)/1.6;if(age>1||age<0){scene.remove(w.m);w.m.geometry.dispose();ondes.splice(k,1);continue}
        w.m.lookAt(camera.position);w.m.scale.setScalar(1+age*1.6);w.m.material.opacity=(1-age)*.28}
      bloom.strength=.7+L*.35+flash*.3;composer.render()}});
