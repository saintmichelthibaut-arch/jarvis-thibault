[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-thibault"
version = "1.0.0"
description = "Jarvis personnel de Thibault : briefing du matin, agenda, météo, Fixigo."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "openai>=1.40",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pymysql>=1.1",
    "python-multipart>=0.0.9",
    "pywebview>=5.0; sys_platform == 'darwin'",
    "sounddevice>=0.4.6; sys_platform == 'darwin'",
    "numpy>=1.26; sys_platform == 'darwin'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
jarvis-thibault = "jarvis_thibault.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_thibault"]
